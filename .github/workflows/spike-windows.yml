name: spike-windows
on:
  workflow_dispatch:
  push:
    branches: ['spike/**']
permissions:
  contents: read
jobs:
  windows:
    name: windows-release
    runs-on: windows-latest
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
      # Same reason as the Android workflow: the spike entry does not use file_picker.
      - run: flutter pub remove file_picker
      - run: flutter build windows --release -t lib/spike/liquid_glass_spike_main.dart
      - name: Zip release folder
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath liquid-glass-spike-windows.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: liquid-glass-spike-windows
          path: liquid-glass-spike-windows.zip
