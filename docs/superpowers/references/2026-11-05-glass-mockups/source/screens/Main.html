<style>

.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--chk-b);background:var(--chk-bg);margin:0;display:grid;place-content:center;flex:none}

.chk:checked::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

        <div role="img" aria-label="۷ روز اخیر همه انجام شده" style="display: flex; gap: 4px; margin-top: 4px"><span style="flex: 1; height: 6px; border-radius: 3px; background: var(--teal)"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: var(--teal)"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: var(--teal)"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: var(--teal)"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: var(--teal)"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: var(--teal)"></span><span style="flex: 1; height: 6px; border-radius: 3px; background: var(--teal)"></span></div>

      <div style="display: flex; flex-direction: column"><span style="font-weight: 700">قسط وام مسکن</span><span style="font-size: 12px; color:var(--text2)">قسط ۲۵ از ۶۰، ۱۰ آذر</span></div>
