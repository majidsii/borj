<title>Borj Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..900&display=swap">
<style>
/* Layout: control bar on top; screen index on the right (RTL start); the device stage fills the rest. Stacks on phones. */
:root {
  --page: #f3f4f6; --panel: #ffffff; --ink: #1b2236; --ink2: #5a6378; --line: #e1e3e8; --accent: #2f6fdb; --chip: #eef1f6;
  --toast: rgba(27,34,54,.92); --toast-ink: #ffffff;
  --font: "Vazirmatn", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --page: #121316; --panel: #1b1c20; --ink: #eeeae4; --ink2: #9b9ca5; --line: #2b2c33; --accent: #5b8cff; --chip: #24262b; --toast: rgba(245,239,231,.95); --toast-ink: #1b1c20; color-scheme: dark; } }
:root[data-theme="dark"] { --page: #121316; --panel: #1b1c20; --ink: #eeeae4; --ink2: #9b9ca5; --line: #2b2c33; --accent: #5b8cff; --chip: #24262b; --toast: rgba(245,239,231,.95); --toast-ink: #1b1c20; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.6; margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; box-sizing: border-box; }
.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 12px; height: calc(100vh - 24px); min-height: 560px; }
.bar { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bar h1 { font-size: 18px; font-weight: 900; margin: 0 0 0 8px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 99px; padding: 3px; }
.seg button, .btn { border: 0; background: transparent; color: var(--ink); font: 600 13px/1 var(--font); padding: 8px 14px; border-radius: 99px; cursor: pointer; touch-action: manipulation; }
.seg button[aria-pressed="true"] { background: var(--panel); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.btn { background: var(--chip); }
.btn:active, .seg button:active { transform: scale(.97); }
.caption { margin-inline-start: auto; color: var(--ink2); font-size: 13px; min-width: 0; }
.caption b { color: var(--ink); }
.index { background: var(--panel); border-radius: 16px; padding: 12px; overflow-y: auto; min-height: 0; box-shadow: inset 0 0 0 1px var(--line); }
.index h2 { font-size: 12px; color: var(--ink2); margin: 10px 4px 4px; font-weight: 700; letter-spacing: .02em; }
.index h2:first-child { margin-top: 0; }
.index button { display: flex; justify-content: space-between; width: 100%; text-align: start; border: 0; background: none; color: var(--ink); font: 500 14px/1.5 var(--font); padding: 6px 10px; border-radius: 10px; cursor: pointer; }
.index button span { color: var(--ink2); font-size: 11px; }
.index button[aria-current="true"] { background: var(--chip); font-weight: 800; }
.index .note { color: var(--ink2); font-size: 12px; margin: 12px 4px 0; }
.index a { color: var(--accent); }
.stagewrap { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; border-radius: 16px; }
.device { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
.device.phone { border-radius: 54px; box-shadow: 0 0 0 11px #0d0e11, 0 30px 60px rgba(0,0,0,.28); overflow: hidden; }
.device.mac { border-radius: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 30px 60px rgba(0,0,0,.28); overflow: hidden; }
.layer { position: absolute; inset: 0; overflow: hidden; background: transparent; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translate(-50%, 16px); opacity: 0; z-index: 99; display: flex; gap: 12px; align-items: center;
  background: var(--toast); color: var(--toast-ink); border-radius: 99px; padding: 8px 8px 8px 16px; font: 600 14px/1.4 var(--font); white-space: nowrap;
  transition: transform 300ms cubic-bezier(.23,1,.32,1), opacity 200ms cubic-bezier(.23,1,.32,1); pointer-events: none; }
.toast.show { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
.toast button { border: 0; border-radius: 99px; padding: 6px 12px; background: var(--accent); color: #fff; font: 700 13px/1 var(--font); cursor: pointer; }
.tapflash { position: absolute; z-index: 98; pointer-events: none; border-radius: 99px; background: rgba(47,111,219,.18); }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(520px, 1fr); height: auto; }
  .index { max-height: 180px; }
  .caption { flex-basis: 100%; margin: 0; }
}
@media (prefers-reduced-motion: reduce) { .toast { transition: opacity 200ms ease-out; } }
</style>

<div class="app" dir="rtl">
  <div class="bar">
    <h1>نمونهٔ برج</h1>
    <div class="seg" role="group" aria-label="دستگاه"><button id="devPhone" aria-pressed="true">گوشی</button><button id="devMac" aria-pressed="false">دسکتاپ</button></div>
    <div class="seg" role="group" aria-label="پوسته"><button id="thLight" aria-pressed="true">روشن</button><button id="thDark" aria-pressed="false">تیره</button></div>
    <div class="seg" role="group" aria-label="حرکت"><button id="mvFull" aria-pressed="true">حرکت کامل</button><button id="mvReduced" aria-pressed="false">کاهش حرکت</button></div>
    <button class="btn" id="backBtn">بازگشت</button>
    <div class="caption" id="caption" aria-live="polite"></div>
  </div>
  <nav class="index" id="index" aria-label="فهرست صفحه‌ها"></nav>
  <div class="stagewrap" id="stagewrap">
    <div id="sizer" style="position: relative"><div class="device phone" id="device"></div></div>
  </div>
</div>
