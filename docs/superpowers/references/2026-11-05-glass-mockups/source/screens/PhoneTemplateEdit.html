<!--@title Phone template edit-->
<!--@kind phone-->
<style>
a{color:var(--accent)}a:hover{color:var(--link-h)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--fill-3);margin:0;position:relative;flex:none;box-shadow:inset 0 0 0 .75px var(--in-edge)}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(20,30,80,.35)}
.sw:checked{background:var(--teal)}.sw:checked::after{inset-inline-start:20px}
</style>
<div class="bg-root" dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Vazirmatn, -apple-system, Tahoma, sans-serif; color: var(--text)">
<!--@SVG-->
<!--@BGFX-->
<div style="position: relative; padding: 58px 20px 0; color: var(--text)"><h1 style="margin: 0; font-size: 34px; font-weight: 900">قالب‌ها</h1></div><div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(20,24,60,.28)"></div><div role="dialog" aria-label="ویرایش قالب" class="lg lg-l lg-text" style="position: absolute; inset-inline: 8px; top: 46px; bottom: 8px; border-radius: 38px; padding: 8px 14px 0; overflow: hidden">
    <div aria-hidden="true" style="width: 38px; height: 5px; border-radius: 3px; background: rgba(20,30,60,.22); margin: 0 auto"></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 0 4px">
      <button type="button" class="lg-in" aria-label="بستن" style="width: 38px; height: 38px; border: 0; border-radius: 50%; color: var(--text); display: grid; place-items: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      <span style="font-size: 16px; font-weight: 800">ویرایش قالب</span>
      <button type="button" class="lg-in" aria-label="ذخیره" style="width: 38px; height: 38px; border: 0; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></svg></button>
    </div>
    <div class="lg-in" style="border-radius: 18px; display: flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 14px; margin-top: 4px"><span style="font-size: 13px; color: var(--text2)">نام قالب</span><input type="text" value="پرداخت قبض" aria-label="نام قالب" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 16px; font-weight: 800; color: var(--text); text-align: end; outline: none; padding: 0"></div>
    <span style="display: block; padding: 8px 4px 3px; font-size: 12px; font-weight: 700; color: var(--text2)">کار ساخته‌شده</span>
    <div class="lg-in" style="border-radius: 18px"><div style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-bottom: .5px solid var(--ink-14)"><span style="font-size: 13px; color: var(--text2)">عنوان کار</span><input type="text" value="پرداخت قبض {ماه}" aria-label="عنوان کار" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 700; color: var(--text); text-align: end; outline: none; padding: 0"></div><div style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-bottom: .5px solid var(--ink-14)"><span style="font-size: 13px; color: var(--text2)">توضیح</span><input type="text" value="قبض برق، گاز و آب" aria-label="توضیح" style="flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; font-weight: 500; color: var(--text); text-align: end; outline: none; padding: 0"></div><div style="display: flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 12px"><span style="font-size: 13px; color: var(--text2)">اولویت</span><span style="flex: 1"></span><button type="button" aria-pressed="false" style="height: 28px; padding: 0 12px; border: 0; border-radius: 99px; background: var(--ink-08); color: var(--text); font-size: 12px; font-weight: 600">کم</button><button type="button" aria-pressed="true" style="height: 28px; padding: 0 12px; border: 0; border-radius: 99px; background: var(--warn); color: #fff; font-size: 12px; font-weight: 800">متوسط</button><button type="button" aria-pressed="false" style="height: 28px; padding: 0 12px; border: 0; border-radius: 99px; background: var(--ink-08); color: var(--text); font-size: 12px; font-weight: 600">بالا</button></div></div>
    <span style="display: block; padding: 8px 4px 3px; font-size: 12px; font-weight: 700; color: var(--text2)">فهرست، زمان و تکرار</span>
    <div class="lg-in" style="border-radius: 18px"><div style="padding: 8px 12px; border-bottom: .5px solid var(--ink-14); display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="display: grid; color: var(--link)"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15zM10 21h4"/></svg></span><span style="font-size: 13px; color: var(--text2)">یادآور</span><span style="flex: 1"></span><span style="display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 6px 0 10px; border-radius: 99px; background: rgba(47,111,219,.14); color: var(--link-h); font-size: 12px; font-weight: 700">۱ روز قبل<button type="button" aria-label="حذف قانون" style="border: 0; background: transparent; color: var(--link-h); display: grid; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span><span style="display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 6px 0 10px; border-radius: 99px; background: rgba(47,111,219,.14); color: var(--link-h); font-size: 12px; font-weight: 700">در زمان شروع<button type="button" aria-label="حذف قانون" style="border: 0; background: transparent; color: var(--link-h); display: grid; padding: 0"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span></div><div style="display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px; border-bottom: .5px solid var(--ink-14);"><span aria-hidden="true" style="color: var(--link); display: grid"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12M6 21h12M7 3c0 5 5 6 5 9s-5 4-5 9M17 3c0 5-5 6-5 9s5 4 5 9"/></svg></span><span style="font-size: 13px; color: var(--text2)">تخمین</span><span style="flex: 1; text-align: end; font-size: 14px; font-weight: 700">۱۵ دقیقه</span></div><div style="display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px; border-bottom: .5px solid var(--ink-14);"><span aria-hidden="true" style="color: var(--link); display: grid"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l3 3-3 3M4 11V9a3 3 0 0 1 3-3h13M7 21l-3-3 3-3M20 13v2a3 3 0 0 1-3 3H4"/></svg></span><span style="font-size: 13px; color: var(--text2)">تکرار</span><span style="flex: 1; text-align: end; font-size: 14px; font-weight: 700">ماهانه · روز ۱۰ هر ماه</span></div><div style="display: flex; align-items: center; gap: 8px; min-height: 38px; padding: 0 12px;"><span aria-hidden="true" style="color: var(--link); display: grid"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 5h12l-2 4 2 4H5"/></svg></span><span style="font-size: 13px; color: var(--text2)">پایان تکرار</span><span style="flex: 1; text-align: end; font-size: 14px; font-weight: 700">۶ ماه پس از شروع</span></div></div>
    <div class="lg-in" style="border-radius: 18px; margin-top: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 12px; font-weight: 700; color: var(--text2)">نمونهٔ کار ساخته‌شده</span><span style="font-size: 15px; font-weight: 800">پرداخت قبض آبان</span><span style="font-size: 12px; color: var(--text2)">۱۰ آبان · یادآور ۱ روز قبل · ۱۵ دقیقه</span><span style="font-size: 12px; color: var(--text2)">این قالب تاکنون ۱۲ بار استفاده شده است.</span></div>
    <div style="display: flex; gap: 8px; margin-top: 10px">
      <button type="button" class="lg-in" style="flex: 1; height: 42px; border: 0; border-radius: 99px; color: var(--link); font-size: 13px; font-weight: 800">پیش‌نمایش در ثبت سریع</button>
      <button type="button" class="lg-in" style="height: 42px; padding: 0 16px; border: 0; border-radius: 99px; color: var(--danger); font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg> حذف</button>
    </div>
  </div>
</div>
