.lg{position:relative;isolation:isolate;background:var(--g-bg);color:var(--text);
-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));backdrop-filter:blur(var(--blur)) saturate(var(--sat));

.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;

.lg-m{backdrop-filter:blur(var(--blur)) saturate(var(--sat)) url(#lg-m)}
.lg-l{backdrop-filter:blur(var(--blur)) saturate(var(--sat)) url(#lg-l)}
.lg-text{background:var(--g-bg-text)}
.lg-clear{background:var(--g-bg-clear)}
.lg-clear.lg-s{--blur:3px;--sat:1.4}.lg-clear.lg-m{--blur:4px;--sat:1.4}.lg-clear.lg-l{--blur:6px;--sat:1.4}

.lg-dark{--blur:14px;color:var(--text)}
.lg-dark.lg-text{background:var(--g-bg-text)}
.lg-dark{background:var(--g-bg)}

.lg-tint,.lg-tint.lg-text{background:linear-gradient(160deg,rgba(124,172,255,.96) 0%,rgba(47,111,219,.94) 55%,rgba(33,84,192,.97) 100%);color:#fff;

.lg-tint{--g-rim-hi:rgba(255,255,255,1);--g-rim-lo:rgba(10,30,110,.55)}
/* flat glass for things INSIDE glass (nested backdrop-filter cannot see the page) */
.lg-in{position:relative;isolation:isolate;background:var(--in-bg);color:var(--text);
box-shadow:0 0 0 .75px var(--in-edge),inset 0 1.5px 0 var(--in-hi),inset 0 -2px 3px -1px var(--g-in-lo),0 2px 6px -1px var(--in-sh)}
