<div class="bg-root" dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Vazirmatn, -apple-system, Tahoma, sans-serif; color: var(--text)">
<!--@SVG-->
<!--@BGFX-->
<div style="position:relative;padding:64px 24px 0;display:flex;flex-direction:column;align-items:center;text-align:center">
<div class="lg lg-l lg-text" role="img" aria-label="نشان برنامه" style="width:80px;height:80px;border-radius:25px;display:grid;place-items:center;color:var(--link)"><svg aria-hidden="true" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></svg></div>

<p style="margin:6px 0 0;font-size:14px;line-height:1.9;color:var(--text2)">کار، پول و عادت؛ فارسی و با تقویم شمسی.</p></div>
<div style="position:relative;padding:18px 16px 0"><section class="lg lg-m lg-text" style="border-radius:26px;padding:2px 16px"><div style="display:flex;align-items:center;gap:14px;padding:10px 0"><span style="width:40px;height:40px;border-radius:12px;background:#2F6FDB;color:#fff;display:grid;place-items:center;flex:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM8 12l3 3 5-6"/></svg></span><div style="flex:1;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:800">کارهای روزانه</span><span style="font-size:12.5px;line-height:1.7;color:var(--text2)">برنامهٔ امروز، یادآور و تایمر برای هر کار.</span></div></div><div style="border-top:.5px solid var(--ink-14)"></div><div style="display:flex;align-items:center;gap:14px;padding:10px 0"><span style="width:40px;height:40px;border-radius:12px;background:#1FB5A8;color:#fff;display:grid;place-items:center;flex:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM3 7l3-3h11M17 14h2"/></svg></span><div style="flex:1;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:800">پول و بودجه</span><span style="font-size:12.5px;line-height:1.7;color:var(--text2)">تراکنش‌ها، قسط‌ها و بدهی‌ها به تومان.</span></div></div><div style="border-top:.5px solid var(--ink-14)"></div><div style="display:flex;align-items:center;gap:14px;padding:10px 0"><span style="width:40px;height:40px;border-radius:12px;background:#8E6BD9;color:#fff;display:grid;place-items:center;flex:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M8.5 8.8A10 10 0 0 0 3 12M5.5 15.5a6 6 0 0 1 4-2M12 19h.01M16 11.5A10 10 0 0 1 21 12"/></svg></span><div style="flex:1;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:800">آفلاین و خصوصی</span><span style="font-size:12.5px;line-height:1.7;color:var(--text2)">بدون اینترنت هم کامل کار می‌کند.</span></div></div></section></div>
<div style="position:relative;padding:12px 16px 0"><div class="lg lg-m lg-clear" style="border-radius:20px;padding:12px 14px;display:flex;align-items:center;gap:10px"><span style="color:var(--success);flex:none"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg></span><span style="font-size:12.5px;line-height:1.8;color:var(--text)">بدون حساب کاربری و بدون ارسال داده؛ هر چه می‌نویسی فقط روی همین دستگاه می‌ماند.</span></div></div>
<div style="position:absolute;bottom:30px;inset-inline:16px;display:flex;flex-direction:column;gap:10px;align-items:stretch">

<button type="button" class="lg lg-m lg-text" style="height:52px;border:0;border-radius:99px;font-size:15px;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;gap:8px"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"/></svg> انتقال از نسخهٔ ۱</button></div>
