<!--@title Phone quick entry-->
<!--@kind phone-->
<style>
a{color:var(--accent)}a:hover{color:var(--link-h)}
.chk{appearance:none;-webkit-appearance:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--chk-b);background:var(--chk-bg);margin:0;display:grid;place-content:center;flex:none}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:10px;height:5px;border:solid #fff;border-width:0 0 2px 2px;transform:rotate(-45deg) translate(1px,-1px)}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
<div class="bg-root" dir="rtl" style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: Vazirmatn, -apple-system, Tahoma, sans-serif; color: var(--text)">
<!--@SVG-->
<!--@BGFX-->

<div style="position: relative; padding: 58px 24px 0; color: var(--text)"><span style="font-size: 15px; font-weight: 600">چهارشنبه ۱۳ آبان</span><h1 style="margin: 0; font-size: 34px; font-weight: 900">امروز</h1></div>
<section class="lg lg-l lg-text" aria-label="ورود سریع" style="position: absolute; inset-inline: 8px; top: 150px; bottom: 8px; border-radius: 34px; padding: 10px 18px 18px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box">
  <div aria-hidden="true" style="align-self: center; width: 38px; height: 5px; border-radius: 3px; background: var(--ink-3)"></div>
  <div style="display: flex; justify-content: space-between; align-items: center">
    <h2 style="margin: 0; font-size: 21px; font-weight: 900">ورود سریع</h2>
    <button type="button" class="lg-in" aria-label="بستن" style="width: 36px; height: 36px; border: 0; border-radius: 50%; color: var(--text); display: grid; place-items: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" ><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="lg-in" role="group" aria-label="نوع" style="display: flex; padding: 3px; border-radius: 99px; gap: 2px">
    <button type="button" aria-pressed="true" style="flex: 1; height: 34px; border: 0; border-radius: 99px; background: #fff; box-shadow: 0 1px 4px rgba(20,30,80,.2); font: inherit; font-size: 13px; font-weight: 800; color: var(--link)">هزینه</button>
    <button type="button" aria-pressed="false" style="flex: 1; height: 34px; border: 0; border-radius: 99px; background: transparent; font: inherit; font-size: 13px; color: var(--text)">درآمد</button>
    <button type="button" aria-pressed="false" style="flex: 1; height: 34px; border: 0; border-radius: 99px; background: transparent; font: inherit; font-size: 13px; color: var(--text)">کار</button>
    <button type="button" aria-pressed="false" style="flex: 1; height: 34px; border: 0; border-radius: 99px; background: transparent; font: inherit; font-size: 13px; color: var(--text)">عادت</button>
  </div>
  <label class="lg-in" style="display: block; border-radius: 22px; padding: 12px 16px; background: var(--surf)">
    <span style="font-size: 12px; color: var(--text2)">بنویسید، بقیه را خودم می‌فهمم</span>
    <div style="font-size: 20px; font-weight: 700; line-height: 2; margin-top: 2px">ناهار با علی <span style="background: rgba(47,111,219,.2); color: var(--link-h); border-radius: 9px; padding: 1px 7px">۴۵۰ تومن</span> <span style="background: rgba(11,133,122,.2); color: var(--success); border-radius: 9px; padding: 1px 7px">از کارت ملت</span></div>
    <input type="text" value="ناهار با علی ۴۵۰ تومن از کارت ملت" aria-label="متن ورودی" style="position: absolute; opacity: 0; width: 1px; height: 1px">
  </label>
  <div>
    <span style="font-size: 12px; font-weight: 700; color: var(--text2)">تشخیص‌ها</span>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px">
      <button type="button" class="lg-in" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 99px; background: rgba(47,111,219,.18); color: var(--link-h); font: inherit; font-size: 13px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/></svg><span style="color: var(--text2)">مبلغ</span><b style="font-weight: 800">۴۵۰٬۰۰۰ تومان</b></button>
      <button type="button" class="lg-in" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 99px; background: rgba(11,133,122,.18); color: var(--success); font: inherit; font-size: 13px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 10h18M16 15h2"/></svg><span style="color: var(--text2)">حساب</span><b style="font-weight: 800">کارت ملت</b></button>
      <button type="button" class="lg-in" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 99px; background: rgba(246,178,107,.4); color: var(--warn); font: inherit; font-size: 13px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 5h2l2 11h10l2-8H7"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg><span style="color: var(--text2)">دسته</span><b style="font-weight: 800">خوراک</b></button>
      <button type="button" class="lg-in" style="display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border: 0; border-radius: 99px; background: var(--surf); color: var(--text); font: inherit; font-size: 13px"><svg aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span style="color: var(--text2)">تاریخ</span><b style="font-weight: 800">امروز</b></button>
    </div>
    <span style="display: block; margin-top: 6px; font-size: 12px; color: var(--text2)">دسته از «ناهار» حدس زده شد؛ با لمس آن را عوض کنید.</span>
  </div>
  <div class="lg-in" aria-label="پیش‌نمایش" style="border-radius: 24px; padding: 14px 16px; background: var(--surf); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 12px">
      <span class="lg-in" style="width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; color: var(--warn); background: rgba(246,178,107,.45); flex: none"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 5h2l2 11h10l2-8H7"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg></span>
      <div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 16px">ناهار با علی</span><span style="font-size: 12px; color: var(--text2)">خوراک · کارت ملت · امروز ۱۴:۳۰</span></div>
      <span style="font-weight: 900; font-size: 17px">۴۵۰٬۰۰۰−</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; border-top: .5px solid var(--ink-14); padding-top: 10px">
      <div style="display: flex; justify-content: space-between"><span style="color: var(--text2)">مانده کارت ملت پس از ثبت</span><b>۲۰٬۹۵۰٬۰۰۰</b></div>
      <div style="display: flex; justify-content: space-between"><span style="color: var(--text2)">خوراک در بودجهٔ آبان</span><b>۵٬۱۸۰٬۰۰۰ از ۶٬۵۰۰٬۰۰۰</b></div>
      <div role="img" aria-label="۸۰ درصد بودجهٔ خوراک" style="height: 6px; border-radius: 99px; background: var(--ink-14); display: flex; overflow: hidden"><div style="width: 73%; background: var(--accent)"></div><div style="width: 7%; background: #F2A33A"></div></div>
    </div>
  </div>
  <div style="margin-top: auto; display: flex; gap: 10px">
    <button type="button" style="flex: 1; height: 54px; border: 0; border-radius: 99px; background: var(--accent); color: #fff; font: inherit; font-size: 17px; font-weight: 900; box-shadow: inset 0 1px 1px rgba(255,255,255,.5), 0 4px 12px rgba(47,111,219,.35)">ثبت</button>
    <button type="button" class="lg-in" style="height: 54px; padding: 0 20px; border: 0; border-radius: 99px; font: inherit; font-size: 15px; font-weight: 700; color: var(--link)">ویرایش جزئیات</button>
  </div>
</section>

</div>
