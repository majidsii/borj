name: spike-android
on:
  workflow_dispatch:
  push:
    branches: ['spike/**']
permissions:
  contents: read
jobs:
  apk:
    name: apk-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: A-plain
            entry: lib/spike/android_plain_main.dart
            suffix: .lgspikea
            label: LG A plain
            gpu: 'true'
          - variant: B-noGpu
            entry: lib/spike/liquid_glass_spike_main.dart
            suffix: .lgspikeb
            label: LG B noGPU
            gpu: 'false'
          - variant: C-full
            entry: lib/spike/liquid_glass_spike_main.dart
            suffix: .lgspikec
            label: LG C full
            gpu: 'true'
    env:
      PUB_HOSTED_URL: https://pub.flutter-io.cn
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.5
      # file_picker's Kotlin plugin class is not visible to the app's Java
      # compile under Flutter 3.47 built-in Kotlin; the spike entry does not use it.
      - run: flutter pub remove file_picker
      - run: flutter build apk --release -t "$ENTRY"
        env:
          ENTRY: ${{ matrix.entry }}
          ORG_GRADLE_PROJECT_lgSuffix: ${{ matrix.suffix }}
          ORG_GRADLE_PROJECT_appLabel: ${{ matrix.label }}
          ORG_GRADLE_PROJECT_enableFlutterGpu: ${{ matrix.gpu }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: LG-${{ matrix.variant }}
          path: build/app/outputs/flutter-apk/app-release.apk
